<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test</title></head>
<body style="font:20px sans-serif;padding:20px">
<h2>✅ GitHub Pages is working</h2>
<p id="a">Checking 3D support…</p><p id="b">Checking 3D library…</p>
<script>
var c=document.createElement('canvas');
document.getElementById('a').textContent=(c.getContext('webgl')||c.getContext('experimental-webgl'))?'✅ 3D (WebGL) works on this device':'❌ 3D (WebGL) is NOT available on this device';
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
document.getElementById('b').textContent=window.THREE?'✅ 3D library loaded':'❌ 3D library did not load (internet or blocked)';
</script>
</body></html>
