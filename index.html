<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ChemLab 3D</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#07111f;
    color:#fff;
    min-height:100vh;
}

.app{
    max-width:1400px;
    margin:auto;
    padding:20px;
}

header{
    text-align:center;
    margin-bottom:20px;
}

header h1{
    font-size:clamp(28px,5vw,48px);
    background:linear-gradient(90deg,#4fdcff,#8b7cff,#ff65c8);
    -webkit-background-clip:text;
    color:transparent;
    margin-bottom:8px;
}

header p{
    color:#9fb1c8;
}

/* MAIN */
.main{
    display:grid;
    grid-template-columns:320px 1fr;
    gap:18px;
}

.panel,
.viewer-card{
    background:rgba(15,29,48,.92);
    border:1px solid rgba(120,170,220,.18);
    border-radius:20px;
    box-shadow:0 15px 50px rgba(0,0,0,.3);
}

/* LEFT */
.panel{
    padding:18px;
}

.search{
    width:100%;
    padding:13px 15px;
    border-radius:12px;
    border:1px solid #29435f;
    background:#091827;
    color:white;
    outline:none;
    margin-bottom:15px;
}

.search:focus{
    border-color:#4fdcff;
}

.category{
    margin-bottom:16px;
}

.category h3{
    color:#70dfff;
    font-size:14px;
    margin-bottom:8px;
}

.substances{
    display:grid;
    gap:7px;
}

.substance{
    width:100%;
    border:1px solid #203b55;
    background:#0b1b2c;
    color:#dcecff;
    padding:10px;
    border-radius:10px;
    cursor:pointer;
    text-align:left;
    transition:.2s;
}

.substance:hover{
    background:#102b43;
    border-color:#4fdcff;
    transform:translateY(-1px);
}

.substance.selected{
    background:#123b52;
    border-color:#5de1ff;
    box-shadow:0 0 12px rgba(79,220,255,.18);
}

/* RIGHT */
.viewer-card{
    padding:15px;
}

.viewer{
    position:relative;
    height:510px;
    min-height:350px;
    overflow:hidden;
    border-radius:17px;
    background:
        radial-gradient(circle at 50% 45%,#152e49 0,#0a1728 42%,#040b14 100%);
    border:1px solid #213c56;
}

canvas{
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
}

.viewer-info{
    position:absolute;
    left:15px;
    top:15px;
    z-index:5;
    padding:9px 12px;
    border-radius:10px;
    background:rgba(3,10,18,.65);
    border:1px solid rgba(130,190,230,.2);
    font-size:12px;
    color:#a9c4dc;
}

/* HEAT */
.heat{
    position:absolute;
    left:50%;
    bottom:12px;
    width:150px;
    height:115px;
    transform:translateX(-50%);
    pointer-events:none;
    opacity:0;
    transition:opacity .3s;
    z-index:4;
}

.heat.on{
    opacity:1;
}

.heat-source{
    position:absolute;
    left:50%;
    bottom:0;
    width:90px;
    height:26px;
    transform:translateX(-50%);
    border-radius:50%;
    background:radial-gradient(
        ellipse,
        rgba(255,245,160,.95),
        rgba(255,145,35,.75) 38%,
        rgba(255,55,20,.35) 65%,
        transparent 75%
    );
    filter:blur(2px);
    animation:heatSource .7s ease-in-out infinite alternate;
}

.heat-wave{
    position:absolute;
    left:50%;
    bottom:20px;
    width:38px;
    height:65px;
    border:2px solid rgba(255,190,75,.65);
    border-color:rgba(255,190,75,.65) transparent transparent transparent;
    border-radius:50%;
    transform:translateX(-50%);
    animation:heatWave 1.3s ease-in-out infinite;
}

.heat-wave:nth-child(3){
    width:55px;
    height:78px;
    animation-delay:.2s;
}

.heat-wave:nth-child(4){
    width:72px;
    height:92px;
    animation-delay:.4s;
}

.heat-particle{
    position:absolute;
    bottom:20px;
    width:5px;
    height:5px;
    border-radius:50%;
    background:#ffd36a;
    box-shadow:0 0 9px #ff9f38;
    animation:thermalRise 1.5s linear infinite;
}

.heat-particle:nth-child(5){
    left:30%;
    animation-delay:.1s;
}

.heat-particle:nth-child(6){
    left:43%;
    animation-delay:.5s;
}

.heat-particle:nth-child(7){
    left:58%;
    animation-delay:.8s;
}

.heat-particle:nth-child(8){
    left:70%;
    animation-delay:.3s;
}

@keyframes heatSource{
    from{transform:translateX(-50%) scale(.9)}
    to{transform:translateX(-50%) scale(1.12)}
}

@keyframes heatWave{
    0%{
        opacity:0;
        transform:translateX(-50%) translateY(15px) scale(.65);
    }
    45%{opacity:.8}
    100%{
        opacity:0;
        transform:translateX(-50%) translateY(-25px) scale(1.2);
    }
}

@keyframes thermalRise{
    0%{
        opacity:0;
        transform:translateY(0) scale(.6);
    }
    20%{opacity:1}
    100%{
        opacity:0;
        transform:translateY(-80px) scale(1);
    }
}

/* REACTION PULSE */
.viewer.reacting::before{
    content:"";
    position:absolute;
    inset:0;
    z-index:2;
    pointer-events:none;
    background:radial-gradient(
        circle at 50% 48%,
        rgba(255,196,75,.22),
        rgba(255,92,30,.08) 35%,
        transparent 70%
    );
    animation:reactionFlash .9s ease-out;
}

@keyframes reactionFlash{
    0%{
        opacity:0;
        transform:scale(.92);
    }
    18%{opacity:1}
    100%{
        opacity:0;
        transform:scale(1.08);
    }
}

/* BOTTOM */
.bottom{
    margin-top:15px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.box{
    background:#091827;
    border:1px solid #203b55;
    border-radius:15px;
    padding:15px;
}

.box h3{
    font-size:14px;
    color:#70dfff;
    margin-bottom:10px;
}

.reactants{
    min-height:55px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.chip{
    padding:8px 11px;
    border-radius:20px;
    background:#12334a;
    border:1px solid #2d6d8d;
    color:#dff8ff;
    font-size:13px;
}

.conditions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.condition{
    padding:9px 13px;
    border-radius:10px;
    background:#0d2134;
    border:1px solid #24445e;
    color:#bdd1e5;
    cursor:pointer;
}

.condition.active{
    background:#47351a;
    border-color:#ffbb55;
    color:#ffe2a6;
}

.actions{
    display:flex;
    gap:10px;
    margin-top:15px;
}

button.run,
button.reset{
    flex:1;
    border:0;
    padding:13px;
    border-radius:12px;
    font-weight:bold;
    cursor:pointer;
    font-size:15px;
}

button.run{
    background:linear-gradient(135deg,#25b7e9,#655cf5);
    color:white;
}

button.reset{
    background:#17283a;
    color:#bfd2e5;
    border:1px solid #2a455e;
}

button:hover{
    filter:brightness(1.1);
}

.result{
    margin-top:15px;
    padding:15px;
    border-radius:14px;
    background:#081522;
    border:1px solid #203b55;
}

.result-label{
    font-size:12px;
    color:#7794ad;
    margin-bottom:6px;
}

.result-equation{
    font-size:clamp(17px,3vw,25px);
    color:#fff;
    font-weight:bold;
    word-break:break-word;
}

.status{
    margin-top:8px;
    font-size:13px;
    color:#8ca6bd;
}

/* MOBILE */
@media(max-width:900px){
    .main{
        grid-template-columns:1fr;
    }

    .panel{
        order:2;
    }

    .viewer-card{
        order:1;
    }

    .bottom{
        grid-template-columns:1fr;
    }

    .viewer{
        height:430px;
    }
}

@media(max-width:550px){
    .app{
        padding:10px;
    }

    .viewer{
        height:360px;
    }

    .actions{
        flex-direction:column;
    }
}

@media(prefers-reduced-motion:reduce){
    *,
    *::before,
    *::after{
        animation-duration:.001ms !important;
        animation-iteration-count:1 !important;
        scroll-behavior:auto !important;
    }
}
</style>
</head>

/* =========================
   APP STATE
========================= */

let selected = [];
let conditions = new Set();
let resultProduct = null;

const viewer = document.getElementById("viewer");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const substanceList =
    document.getElementById("substanceList");

const reactants =
    document.getElementById("reactants");

const resultEquation =
    document.getElementById("resultEquation");

const status =
    document.getElementById("status");

const heat =
    document.getElementById("heat");

const search =
    document.getElementById("search");

const runButton =
    document.getElementById("runButton");

const resetButton =
    document.getElementById("resetButton");


/* =========================
   DRAWING
========================= */

let rotation = 0;
let zoom = 1;
let animationFrame = 0;

function resizeCanvas(){

    const rect = viewer.getBoundingClientRect();

    const dpr =
        Math.min(window.devicePixelRatio || 1,2);

    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;

    canvas.style.width = rect.width + "px";
    canvas.style.height = rect.height + "px";

    ctx.setTransform(dpr,0,0,dpr,0,0);

    drawScene();
}

window.addEventListener("resize",resizeCanvas);


function atomColor(element){

    const colors = {
        H:"#ffffff",
        O:"#ff5c67",
        C:"#444c58",
        N:"#4d8cff",
        Cl:"#55d66b",
        S:"#f5c84b",
        Fe:"#c46b3d",
        K:"#b87cff",
        I:"#7f66ff",
        Na:"#9da8b4",
        Ca:"#8de0c1",
        Br:"#a74d38",
        Ag:"#d7dbe2",
        Pb:"#6e7892"
    };

    return colors[element] || "#7ddcff";
}


function parseFormula(formula){

    if(!formula) return [];

    const clean =
        formula
            .replace(/[₀₁₂₃₄₅₆₇₈₉]/g,"")
            .replace(/[⁺⁻²³¹⁴⁵⁶⁷⁸⁹]/g,"");

    const matches =
        clean.match(/[A-Z][a-z]?\d*/g);

    if(!matches) return [];

    const atoms=[];

    matches.forEach(token=>{

        const match =
            token.match(/^([A-Z][a-z]?)(\d*)$/);

        if(!match) return;

        const element=match[1];

        let count =
            parseInt(match[2] || "1");

        count=Math.min(count,8);

        for(let i=0;i<count;i++){
            atoms.push(element);
        }

    });

    return atoms;
}


function drawAtom(x,y,r,element){

    const gradient =
        ctx.createRadialGradient(
            x-r*.35,
            y-r*.4,
            r*.1,
            x,
            y,
            r
        );

    gradient.addColorStop(
        0,
        "#ffffff"
    );

    gradient.addColorStop(
        .22,
        atomColor(element)
    );

    gradient.addColorStop(
        1,
        "#111820"
    );

    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle=gradient;
    ctx.fill();

    ctx.strokeStyle="rgba(255,255,255,.2)";
    ctx.lineWidth=1;
    ctx.stroke();

    ctx.fillStyle="rgba(255,255,255,.8)";
    ctx.font=`${Math.max(10,r*.65)}px Arial`;
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText(element,x,y);
}


function drawMolecule(substance){

    const rect =
        viewer.getBoundingClientRect();

    const w=rect.width;
    const h=rect.height;

    const formula =
        substance.formula
            .replace(/[₀₁₂₃₄₅₆₇₈₉]/g,"");

    const atoms =
        parseFormula(formula);

    if(!atoms.length){

        ctx.fillStyle="#8aa3b8";
        ctx.font="18px Arial";
        ctx.textAlign="center";
        ctx.fillText(
            substance.name,
            w/2,
            h/2
        );

        return;
    }

    const count=Math.min(atoms.length,14);

    const centerX=w/2;
    const centerY=h/2;

    const radius =
        Math.min(
            145,
            Math.max(75,100+count*3)
        ) * zoom;

    const positions=[];

    for(let i=0;i<count;i++){

        const angle =
            rotation +
            (Math.PI*2*i/count);

        const ring =
            count<=4
                ? radius*.45
                : radius*.55;

        const x =
            centerX +
            Math.cos(angle)*ring;

        const y =
            centerY +
            Math.sin(angle)*ring*.65;

        positions.push({x,y});
    }

    /* bonds */

    for(let i=0;i<positions.length-1;i++){

        const a=positions[i];
        const b=positions[i+1];

        ctx.beginPath();
        ctx.moveTo(a.x,a.y);
        ctx.lineTo(b.x,b.y);

        ctx.strokeStyle="rgba(190,215,235,.65)";
        ctx.lineWidth=7;
        ctx.stroke();

        ctx.strokeStyle="rgba(255,255,255,.22)";
        ctx.lineWidth=2;
        ctx.stroke();

    }

    positions.forEach(
        (p,i)=>{
            const atomR =
                Math.max(
                    18,
                    Math.min(
                        32,
                        42-count
                    )
                );

            drawAtom(
                p.x,
                p.y,
                atomR,
                atoms[i]
            );
        }
    );

    ctx.fillStyle="rgba(255,255,255,.65)";
    ctx.font="14px Arial";
    ctx.textAlign="center";
    ctx.fillText(
        substance.name,
        centerX,
        h-30
    );
}


function drawScene(){

    const rect =
        viewer.getBoundingClientRect();

    if(!rect.width || !rect.height)
        return;

    ctx.clearRect(
        0,
        0,
        rect.width,
        rect.height
    );

    if(resultProduct){

        const product =
            substances.find(
                s=>s.id===resultProduct
            );

        if(product){
            drawMolecule(product);
            return;
        }
    }

    if(selected.length){

        const substance =
            substances.find(
                s=>s.id===selected[selected.length-1]
            );

        if(substance){
            drawMolecule(substance);
            return;
        }
    }

    ctx.fillStyle="#678198";
    ctx.font="18px Arial";
    ctx.textAlign="center";
    ctx.fillText(
        "Select a substance to visualize",
        rect.width/2,
        rect.height/2
    );
}


/* =========================
   SUBSTANCE UI
========================= */

function renderSubstances(filter=""){

    substanceList.innerHTML="";

    const categories = {};

    substances.forEach(s=>{

        if(
            filter &&
            !(
                s.name.toLowerCase().includes(filter) ||
                s.formula.toLowerCase().includes(filter)
            )
        ){
            return;
        }

        if(!categories[s.category])
            categories[s.category]=[];

        categories[s.category].push(s);

    });

    Object.keys(categories).forEach(category=>{

        const wrapper =
            document.createElement("div");

        wrapper.className="category";

        const title =
            document.createElement("h3");

        title.textContent=category;

        wrapper.appendChild(title);

        const list =
            document.createElement("div");

        list.className="substances";

        categories[category].forEach(s=>{

            const button =
                document.createElement("button");

            button.type="button";
            button.className="substance";
            button.dataset.id=s.id;

            button.innerHTML=
                `<strong>${s.name}</strong><br>
                 <small>${s.formula}</small>`;

            if(selected.includes(s.id))
                button.classList.add("selected");

            button.addEventListener(
                "click",
                ()=>{
                    addReactant(s.id);
                }
            );

            list.appendChild(button);

        });

        wrapper.appendChild(list);

        substanceList.appendChild(wrapper);

    });

}


function addReactant(id){

    if(selected.length>=4){

        status.textContent =
            "Maximum 4 reactants can be selected.";

        return;
    }

    selected.push(id);

    resultProduct=null;

    updateReactants();
    renderSubstances(search.value.toLowerCase());
    drawScene();

    status.textContent =
        "Reactant added. Select more substances or run the reaction.";
}


function updateReactants(){

    reactants.innerHTML="";

    if(!selected.length){

        reactants.innerHTML=
            `<span style="color:#718ba3;font-size:13px;">
                Select substances from the left
            </span>`;

        return;
    }

    selected.forEach((id,index)=>{

        const substance =
            substances.find(
                s=>s.id===id
            );

        if(!substance) return;

        const chip =
            document.createElement("span");

        chip.className="chip";

        chip.textContent =
            `${substance.formula} ×${index+1}`;

        reactants.appendChild(chip);

    });

}


/* =========================
   CONDITIONS
========================= */

document
.querySelectorAll(".condition")
.forEach(button=>{

    button.addEventListener(
        "click",
        ()=>{

            const condition =
                button.dataset.condition;

            if(
                conditions.has(condition)
            ){

                conditions.delete(condition);
                button.classList.remove("active");

            }else{

                conditions.add(condition);
                button.classList.add("active");

            }

            heat.classList.toggle(
                "on",
                conditions.has("heat")
            );

            status.textContent =
                conditions.size
                    ? "Condition updated."
                    : "Ready.";

        }
    );

});


/* =========================
   REACTION ENGINE
========================= */

function normalizedIds(ids){

    return [...new Set(ids)]
        .sort()
        .join("|");

}


function findReaction(){

    const selectedKey =
        normalizedIds(selected);

    if(!selectedKey){
        return null;
    }

    for(
        const reaction of reactions
    ){

        if(
            normalizedIds(reaction.ids)
            !== selectedKey
        ){
            continue;
        }

        const required =
            Array.isArray(reaction.needs)
                ? reaction.needs
                : [];

        const missing =
            required.filter(
                condition =>
                    !conditions.has(condition)
            );

        if(missing.length){

            return {
                type:"missing-condition",
                needs:missing,
                reaction
            };

        }

        return {
            type:"reaction",
            ...reaction
        };

    }

    return {
        type:"unknown",
        reaction:null
    };

}


/* =========================
   RUN REACTION
========================= */

function runReaction(){

    if(!selected.length){

        resultEquation.textContent =
            "No reactants selected";

        status.textContent =
            "Select at least one reactant.";

        return;
    }

    const match =
        findReaction();

    if(
        match &&
        match.type==="missing-condition"
    ){

        resultProduct=null;

        const names =
            match.needs.map(
                condition=>{
                    if(condition==="heat")
                        return "🔥 Heat";
                    if(condition==="catalyst")
                        return "⚗ Catalyst";
                    if(condition==="light")
                        return "💡 Light";
                    if(condition==="pressure")
                        return "⬆ Pressure";
                    return condition;
                }
            ).join(", ");

        resultEquation.textContent =
            match.reaction.out;

        status.textContent =
            "Reaction waiting: Required condition — " +
            names;

        drawScene();

        return;
    }

    if(
        match &&
        match.type==="reaction"
    ){

        resultEquation.textContent =
            match.out;

        resultProduct =
            match.product || null;

        status.textContent =
            "✓ Reaction simulation complete";

    }else{

        const names =
            selected.map(
                id=>{
                    const s =
                        substances.find(
                            x=>x.id===id
                        );

                    return s
                        ? s.formula
                        : id;
                }
            );

        resultEquation.textContent =
            names.join(" + ") +
            " → simulation completed";

        resultProduct=null;

        status.textContent =
            "No predefined reaction in this educational model.";

    }

    viewer.classList.remove("reacting");

    void viewer.offsetWidth;

    viewer.classList.add("reacting");

    setTimeout(
        ()=>{
            viewer.classList.remove("reacting");
        },
        900
    );

    drawScene();

}


/* =========================
   RESET
========================= */

function resetExperiment(){

    selected=[];
    conditions.clear();
    resultProduct=null;

    document
    .querySelectorAll(".condition")
    .forEach(
        button=>{
            button.classList.remove("active");
        }
    );

    heat.classList.remove("on");

    resultEquation.textContent =
        "Select reactants and run a reaction";

    status.textContent="Ready";

    updateReactants();

    renderSubstances(search.value.toLowerCase());

    drawScene();

}


/* =========================
   SEARCH
========================= */

search.addEventListener(
    "input",
    ()=>{
        renderSubstances(
            search.value
                .trim()
                .toLowerCase()
        );
    }
);


/* =========================
   MOUSE / TOUCH ROTATION
========================= */

let dragging=false;
let lastX=0;

canvas.addEventListener(
    "pointerdown",
    e=>{

        dragging=true;
        lastX=e.clientX;

        canvas.setPointerCapture(
            e.pointerId
        );

    }
);

canvas.addEventListener(
    "pointermove",
    e=>{

        if(!dragging)
            return;

        const dx =
            e.clientX-lastX;

        lastX=e.clientX;

        rotation += dx*.012;

        drawScene();

    }
);

canvas.addEventListener(
    "pointerup",
    ()=>{
        dragging=false;
    }
);

canvas.addEventListener(
    "pointercancel",
    ()=>{
        dragging=false;
    }
);


/* =========================
   ZOOM
========================= */

canvas.addEventListener(
    "wheel",
    e=>{

        e.preventDefault();

        zoom +=
            e.deltaY < 0
                ? .08
                : -.08;

        zoom =
            Math.max(
                .55,
                Math.min(1.7,zoom)
            );

        drawScene();

    },
    {passive:false}
);


/* =========================
   BUTTONS
========================= */

runButton.addEventListener(
    "click",
    runReaction
);

resetButton.addEventListener(
    "click",
    resetExperiment
);


/* =========================
   START
========================= */

renderSubstances();

resizeCanvas();

</script>
