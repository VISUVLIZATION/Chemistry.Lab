<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<meta name="theme-color" content="#06101d">

<title>ChemLab 3D</title>

<style>

/* =========================================================
   GLOBAL
========================================================= */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;

    background:#06101d;
    color:#fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

body{
    overflow-x:hidden;
}

button,
input{
    font:inherit;
}


/* =========================================================
   HEADER
========================================================= */

header{
    height:68px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 22px;

    background:#091a2d;

    border-bottom:
        1px solid #233a54;

    position:relative;

    z-index:50;
}

.logo{
    font-size:24px;
    font-weight:800;
}

.logo span{
    color:#35d8ff;
}

.status{
    color:#8da6bf;
    font-size:12px;
}


/* =========================================================
   MAIN APP
========================================================= */

.app{
    min-height:
        calc(100vh - 68px);

    display:grid;

    grid-template-columns:
        290px
        minmax(0,1fr)
        320px;
}


/* =========================================================
   LEFT PANEL
========================================================= */

.left{
    background:#09182a;

    border-right:
        1px solid #233a54;

    padding:16px;

    overflow-y:auto;
}

.panel-title{
    margin:0 0 13px;

    font-size:18px;
}

.search{
    width:100%;

    padding:11px;

    border-radius:10px;

    border:
        1px solid #2a4561;

    outline:none;

    background:#06101d;

    color:white;
}

.search:focus{
    border-color:#35d8ff;
}


/* =========================================================
   CATEGORY
========================================================= */

.category{
    margin-top:18px;

    color:#35d8ff;

    font-size:11px;
    font-weight:bold;

    text-transform:uppercase;

    letter-spacing:1px;
}


/* =========================================================
   SUBSTANCE GRID
========================================================= */

.substances{
    margin-top:8px;

    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:7px;
}

.substance{
    min-height:67px;

    padding:9px;

    text-align:left;

    border:
        1px solid #263f5b;

    border-radius:10px;

    background:#0d2035;

    color:white;

    cursor:pointer;

    transition:
        transform .12s ease,
        border-color .12s ease,
        background .12s ease;
}

.substance:hover{
    border-color:#35d8ff;

    background:#112b45;

    transform:translateY(-1px);
}

.substance:active{
    transform:scale(.97);
}

.symbol{
    color:#35d8ff;

    font-size:18px;

    font-weight:800;
}

.name{
    margin-top:4px;

    color:#a7b9cb;

    font-size:10px;

    line-height:1.2;
}


/* =========================================================
   CENTER
========================================================= */

.center{
    min-width:0;

    background:#06101d;
}


/* =========================================================
   3D VIEWER
========================================================= */

.viewer{
    position:relative;

    width:100%;

    height:56vh;

    min-height:350px;

    background:
        radial-gradient(
            circle at center,
            #12314d 0%,
            #081725 45%,
            #06101d 100%
        );

    overflow:hidden;
}

#viewer{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    overflow:hidden;

    touch-action:none;

    user-select:none;
}

#viewer canvas{
    display:block;

    width:100% !important;
    height:100% !important;

    touch-action:none;
}


/* =========================================================
   VIEWER LABEL
========================================================= */

.viewer-title{
    position:absolute;

    top:12px;
    left:12px;

    z-index:20;

    padding:8px 11px;

    border-radius:9px;

    background:
        rgba(3,11,20,.78);

    border:
        1px solid #29445f;

    color:#dcecff;

    font-size:12px;

    pointer-events:none;
}

.viewer-help{
    position:absolute;

    bottom:12px;
    right:12px;

    z-index:20;

    padding:7px 10px;

    border-radius:8px;

    background:
        rgba(3,11,20,.75);

    color:#91a7bd;

    font-size:10px;

    pointer-events:none;
}


/* =========================================================
   LOADING / FALLBACK
========================================================= */

.viewer-message{
    position:absolute;

    inset:0;

    z-index:30;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:25px;

    text-align:center;

    background:#06101d;

    color:#9db0c3;
}

.viewer-message-box{
    max-width:440px;

    padding:25px;

    border-radius:15px;

    border:
        1px solid #29445f;

    background:#0a1b2e;
}

.viewer-message strong{
    display:block;

    margin-bottom:9px;

    color:#35d8ff;

    font-size:18px;
}


/* =========================================================
   HEAT EFFECT
========================================================= */

.heat-overlay{
    position:absolute;

    inset:0;

    z-index:10;

    pointer-events:none;

    opacity:0;

    background:
        radial-gradient(
            circle at 50% 60%,
            rgba(255,190,60,.18),
            transparent 28%
        ),
        radial-gradient(
            circle at 50% 70%,
            rgba(255,80,20,.12),
            transparent 42%
        );
}

.heat-overlay.active{
    animation:
        heatGlow 1.15s infinite alternate;
}

@keyframes heatGlow{

    0%{
        opacity:.12;
        transform:scale(1);
    }

    50%{
        opacity:.32;
        transform:scale(1.03);
    }

    100%{
        opacity:.18;
        transform:scale(1.06);
    }

}


/* =========================================================
   FLAME PARTICLES
========================================================= */

.flame-container{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:190px;

    z-index:11;

    pointer-events:none;

    display:none;

    overflow:hidden;
}

.flame-container.active{
    display:block;
}

.flame{
    position:absolute;

    bottom:-35px;

    width:15px;
    height:55px;

    border-radius:
        50% 50% 45% 45%;

    background:
        linear-gradient(
            to top,
            #ff3b00,
            #ff9d00,
            #ffe56b,
            transparent
        );

    filter:
        drop-shadow(
            0 0 8px
            rgba(255,120,20,.9)
        );

    animation:
        flameRise
        var(--duration)
        linear infinite;

    left:var(--left);
    transform:
        scale(var(--scale))
        rotate(var(--rotate));
}

@keyframes flameRise{

    0%{
        bottom:-40px;
        opacity:0;
    }

    15%{
        opacity:1;
    }

    70%{
        opacity:.85;
    }

    100%{
        bottom:210px;
        opacity:0;

        transform:
            translateX(var(--drift))
            scale(var(--scale))
            rotate(var(--rotate));
    }

}


/* =========================================================
   REACTION AREA
========================================================= */

.reaction-area{
    padding:17px;

    border-top:
        1px solid #233a54;
}

.section-title{
    margin-bottom:9px;

    color:#829ab2;

    font-size:11px;

    text-transform:uppercase;

    letter-spacing:1px;
}

.reactants{
    min-height:61px;

    display:flex;

    flex-wrap:wrap;

    align-items:center;

    gap:7px;

    padding:10px;

    border:
        1px solid #263f5b;

    border-radius:11px;

    background:#09182a;
}

.empty{
    color:#637b93;

    font-size:12px;
}

.reactant{
    padding:8px 10px;

    border-radius:8px;

    background:#122a42;

    border:
        1px solid #2b4b69;

    font-size:12px;
}

.reactant strong{
    color:#35d8ff;
}

.plus{
    color:#647d96;

    font-weight:bold;
}


/* =========================================================
   CONDITIONS
========================================================= */

.conditions{
    display:flex;

    flex-wrap:wrap;

    gap:7px;

    margin-top:8px;
}

.condition{
    padding:9px 11px;

    border-radius:9px;

    border:
        1px solid #2a4561;

    background:#0d2035;

    color:#b7c7d7;

    cursor:pointer;
}

.condition.active{
    color:#35d8ff;

    border-color:#35d8ff;

    background:#10334a;
}


/* =========================================================
   RUN BUTTON
========================================================= */

.run{
    width:100%;

    margin-top:14px;

    padding:14px;

    border:0;

    border-radius:11px;

    background:
        linear-gradient(
            135deg,
            #35d8ff,
            #5cf0ff
        );

    color:#03101a;

    font-weight:800;

    cursor:pointer;

    box-shadow:
        0 5px 22px
        rgba(53,216,255,.12);
}

.run:active{
    transform:scale(.98);
}


/* =========================================================
   RIGHT PANEL
========================================================= */

.right{
    background:#09182a;

    border-left:
        1px solid #233a54;

    padding:17px;

    overflow-y:auto;
}

.result{
    padding:15px;

    min-height:150px;

    border:
        1px solid #263f5b;

    border-radius:12px;

    background:#0d2035;
}

.result-label{
    color:#829ab2;

    font-size:10px;

    text-transform:uppercase;

    letter-spacing:1px;
}

.formula{
    margin-top:12px;

    color:#35d8ff;

    font-size:20px;

    font-weight:800;

    line-height:1.5;
}

.result-name{
    margin-top:7px;

    color:#b1c0cf;

    font-size:12px;
}

.reset{
    width:100%;

    margin-top:10px;

    padding:11px;

    border-radius:9px;

    border:
        1px solid #2a4561;

    background:#0d2035;

    color:white;

    cursor:pointer;
}


/* =========================================================
   TABLET
========================================================= */

@media(max-width:1100px){

    .app{
        grid-template-columns:
            245px
            minmax(0,1fr);
    }

    .right{
        grid-column:
            1 / -1;

        border-left:0;

        border-top:
            1px solid #233a54;
    }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    header{
        height:58px;

        padding:0 13px;
    }

    .logo{
        font-size:20px;
    }

    .status{
        font-size:9px;
    }

    .app{
        display:block;

        min-height:
            calc(100vh - 58px);
    }

    .left{
        border-right:0;

        border-bottom:
            1px solid #233a54;

        padding:13px;
    }

    .viewer{
        height:52vh;

        min-height:320px;

        max-height:560px;
    }

    .reaction-area{
        padding:13px;
    }

    .right{
        border-left:0;

        border-top:
            1px solid #233a54;

        padding:13px;
    }

    .substances{
        grid-template-columns:
            repeat(2,minmax(0,1fr));
    }

}


/* =========================================================
   VERY SMALL PHONE
========================================================= */

@media(max-width:370px){

    .viewer{
        height:48vh;

        min-height:290px;
    }

    .substances{
        grid-template-columns:1fr;
    }

    .viewer-help{
        font-size:8px;
    }

}

</style>
</head>

</section>

</main>

function renderSubstances(
    filter = ""
){

    const query =
        filter
            .trim()
            .toLowerCase();


    substanceBox.innerHTML = "";


    const groups = {};


    substances
        .filter(item => {

            if (!query)
                return true;

            return (
                item.name
                    .toLowerCase()
                    .includes(query)
                ||
                item.symbol
                    .toLowerCase()
                    .includes(query)
                ||
                item.group
                    .toLowerCase()
                    .includes(query)
            );

        })
        .forEach(item => {

            if (!groups[item.group])
                groups[item.group] = [];

            groups[item.group]
                .push(item);

        });


    Object.keys(groups)
        .forEach(groupName => {

            const title =
                document.createElement(
                    "div"
                );

            title.className =
                "category";

            title.textContent =
                groupName;

            substanceBox
                .appendChild(title);


            const grid =
                document.createElement(
                    "div"
                );

            grid.className =
                "substances";


            groups[groupName]
                .forEach(item => {

                    const button =
                        document.createElement(
                            "button"
                        );

                    button.className =
                        "substance";


                    button.innerHTML = `

                        <div class="symbol">
                            ${item.symbol}
                        </div>

                        <div class="name">
                            ${item.name}
                        </div>

                    `;


                    button.addEventListener(
                        "click",
                        () => {

                            selectSubstance(
                                item
                            );

                        }
                    );


                    grid.appendChild(
                        button
                    );

                });


            substanceBox
                .appendChild(grid);

        });

}

/* =========================================================
   THREE.JS LOADER
========================================================= */

function loadScript(
    src
){

    return new Promise(
        (resolve,reject) => {

            const script =
                document.createElement(
                    "script"
                );


            script.src =
                src;

            script.async =
                true;


            script.onload =
                resolve;

            script.onerror =
                reject;


            document.head
                .appendChild(
                    script
                );

        }
    );

}


async function loadThree(){

    if (
        window.THREE
    ){

        threeAvailable =
            true;

        return window.THREE;

    }


    const classic = [

        "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js",

        "https://unpkg.com/three@0.161.0/build/three.min.js"

    ];


    for (
        const src of classic
    ){

        try{

            await loadScript(
                src
            );


            if (
                window.THREE
            ){

                threeAvailable =
                    true;

                return window.THREE;

            }

        }catch(error){

            console.warn(
                "Three.js source failed:",
                src
            );

        }

    }


    throw new Error(
        "Three.js could not load."
    );

}

/* =========================================================
   INIT 3D
========================================================= */

function init3D(){

    const canvas =
        document.createElement(
            "canvas"
        );


    const webgl =
        canvas.getContext(
            "webgl2"
        );


    /*
       WebGL 2 check.
    */

    if (!webgl){

        message(
            "3D fallback mode",
            "This device/browser does not provide WebGL 2. ChemLab remains usable with its responsive interface."
        );

        return;

    }


    scene =
        new THREE.Scene();


    scene.background =
        new THREE.Color(
            0x06101d
        );


    const width =
        Math.max(
            viewer.clientWidth,
            1
        );


    const height =
        Math.max(
            viewer.clientHeight,
            1
        );


    camera =
        new THREE.PerspectiveCamera(
            45,
            width / height,
            .1,
            100
        );


    camera.position.z =
        zoom;


    try{

        renderer =
            new THREE.WebGLRenderer({

                antialias:true,

                powerPreference:
                    "low-power",

                failIfMajorPerformanceCaveat:
                    false

            });

    }catch(error){

        message(
            "3D fallback mode",
            "The device graphics system could not start the WebGL renderer."
        );

        return;

    }


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio || 1,
            1.5
        )
    );


    renderer.setSize(
        width,
        height,
        false
    );


    renderer.domElement.style.width =
        "100%";

    renderer.domElement.style.height =
        "100%";

    renderer.domElement.style.touchAction =
        "none";


    viewer.insertBefore(
        renderer.domElement,
        viewer.firstChild
    );


    /* LIGHT */

    scene.add(
        new THREE.AmbientLight(
            0xffffff,
            1.8
        )
    );


    const light =
        new THREE.DirectionalLight(
            0xffffff,
            2.2
        );


    light.position.set(
        5,
        6,
        8
    );


    scene.add(
        light
    );


    const fill =
        new THREE.DirectionalLight(
            0x65bfff,
            1
        );


    fill.position.set(
        -5,
        2,
        4
    );


    scene.add(
        fill
    );


    group =
        new THREE.Group();


    scene.add(
        group
    );


    threeAvailable =
        true;


    const loading =
        document.getElementById(
            "viewerMessage"
        );


    if (loading)
        loading.remove();


    /* RESIZE */

    window.addEventListener(
        "resize",
        resize3D,
        {
            passive:true
        }
    );


    window.addEventListener(
        "orientationchange",
        () => {

            setTimeout(
                resize3D,
                200
            );

        }
    );


    /* POINTER */

    renderer.domElement
        .addEventListener(
            "pointerdown",
            event => {

                dragging =
                    true;

                lastX =
                    event.clientX;

                lastY =
                    event.clientY;

                try{

                    renderer
                        .domElement
                        .setPointerCapture(
                            event.pointerId
                        );

                }catch(_){}

            }
        );


    renderer.domElement
        .addEventListener(
            "pointermove",
            event => {

                if (!dragging)
                    return;


                rotationY +=
                    (
                        event.clientX -
                        lastX
                    ) * .012;


                rotationX +=
                    (
                        event.clientY -
                        lastY
                    ) * .012;


                rotationX =
                    Math.max(
                        -1.45,
                        Math.min(
                            1.45,
                            rotationX
                        )
                    );


                lastX =
                    event.clientX;

                lastY =
                    event.clientY;

            }
        );


    renderer.domElement
        .addEventListener(
            "pointerup",
            event => {

                dragging =
                    false;

                try{

                    renderer
                        .domElement
                        .releasePointerCapture(
                            event.pointerId
                        );

                }catch(_){}

            }
        );


    renderer.domElement
        .addEventListener(
            "pointercancel",
            () => {

                dragging =
                    false;

            }
        );


    /* MOUSE WHEEL */

    renderer.domElement
        .addEventListener(
            "wheel",
            event => {

                event.preventDefault();


                zoom +=
                    event.deltaY * .01;


                zoom =
                    Math.max(
                        3,
                        Math.min(
                            14,
                            zoom
                        )
                    );


                camera.position.z =
                    zoom;

            },
            {
                passive:false
            }
        );


    /* PINCH ZOOM */

    let startDistance =
        0;

    let startZoom =
        zoom;


    renderer.domElement
        .addEventListener(
            "touchstart",
            event => {

                if (
                    event.touches.length === 2
                ){

                    const dx =
                        event.touches[0].clientX -
                        event.touches[1].clientX;


                    const dy =
                        event.touches[0].clientY -
                        event.touches[1].clientY;


                    startDistance =
                        Math.hypot(
                            dx,
                            dy
                        );


                    startZoom =
                        zoom;

                }

            },
            {
                passive:false
            }
        );


    renderer.domElement
        .addEventListener(
            "touchmove",
            event => {

                if (
                    event.touches.length !== 2
                )
                    return;


                event.preventDefault();


                const dx =
                    event.touches[0].clientX -
                    event.touches[1].clientX;


                const dy =
                    event.touches[0].clientY -
                    event.touches[1].clientY;


                const distance =
                    Math.hypot(
                        dx,
                        dy
                    );


                zoom =
                    startZoom -
                    (
                        distance -
                        startDistance
                    ) * .012;


                zoom =
                    Math.max(
                        3,
                        Math.min(
                            14,
                            zoom
                        )
                    );


                camera.position.z =
                    zoom;

            },
            {
                passive:false
            }
        );


    renderer.setAnimationLoop(
        animate
    );

}


/* =========================================================
   RESIZE
========================================================= */

function resize3D(){

    if (
        !renderer ||
        !camera
    )
        return;


    const width =
        Math.max(
            viewer.clientWidth,
            1
        );


    const height =
        Math.max(
            viewer.clientHeight,
            1
        );


    camera.aspect =
        width / height;


    camera.updateProjectionMatrix();


    renderer.setSize(
        width,
        height,
        false
    );

}


/* =========================================================
   ANIMATION
========================================================= */

function animate(){

    if (group){

        if (!dragging){

            rotationY +=
                .004;

        }


        group.rotation.y =
            rotationY;


        group.rotation.x =
            rotationX;

    }


    if (
        renderer &&
        scene &&
        camera
    ){

        renderer.render(
            scene,
            camera
        );

    }

}


/* =========================================================
   CLEAR 3D
========================================================= */

function clearMolecule(){

    if (!group)
        return;


    while (
        group.children.length
    ){

        const object =
            group.children.pop();


        object.traverse(
            child => {

                if (
                    child.geometry
                ){

                    child.geometry
                        .dispose();

                }


                if (
                    child.material
                ){

                    child.material
                        .dispose();

                }

            }
        );

    }

}

/* =========================================================
   CREATE ATOM
========================================================= */

function atom(
    element,
    position
){

    const radii = {

        H:.48,

        O:.67,

        C:.72,

        N:.67,

        Cl:.78,

        Na:.88,

        Ca:.9,

        Cu:.78,

        Fe:.76,

        S:.7,

        Br:.82,

        I:.86,

        Si:.76,

        Zn:.78,

        Mn:.77,

        Mg:.76,

        Al:.76,

        Ag:.8,

        Pb:.82

    };


    const geometry =
        new THREE.SphereGeometry(
            radii[element] || .7,
            28,
            20
        );


    const material =
        new THREE.MeshStandardMaterial({

            color:
                colors[element] ||
                0xffffff,

            roughness:.35,

            metalness:.05

        });


    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );


    mesh.position.copy(
        position
    );


    group.add(
        mesh
    );


    return mesh;

}


/* =========================================================
   BOND
========================================================= */

function bond(
    a,
    b
){

    const start =
        a.position.clone();

    const end =
        b.position.clone();


    const direction =
        new THREE.Vector3()
            .subVectors(
                end,
                start
            );


    const length =
        direction.length();


    const geometry =
        new THREE.CylinderGeometry(
            .11,
            .11,
            length,
            14
        );


    const material =
        new THREE.MeshStandardMaterial({

            color:0xb9c4d0,

            roughness:.4

        });


    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );


    mesh.position.copy(
        start
    )
    .add(end)
    .multiplyScalar(.5);


    mesh.quaternion
        .setFromUnitVectors(

            new THREE.Vector3(
                0,
                1,
                0
            ),

            direction.normalize()

        );


    group.add(
        mesh
    );

}


/* =========================================================
   MOLECULE BUILDER
========================================================= */

function molecule(
    atoms,
    bonds
){

    const objects = [];


    atoms.forEach(
        data => {

            objects.push(
                atom(

                    data.element,

                    new THREE.Vector3(
                        data.x,
                        data.y,
                        data.z
                    )

                )
            );

        }
    );


    bonds.forEach(
        pair => {

            if (
                objects[pair[0]] &&
                objects[pair[1]]
            ){

                bond(
                    objects[pair[0]],
                    objects[pair[1]]
                );

            }

        }
    );

}


/* =========================================================
   SHOW MOLECULE
========================================================= */

function showMolecule(
    item
){

    if (
        !threeAvailable ||
        !group
    )
        return;


    clearMolecule();


    viewerTitle.textContent =
        item.name +
        " • " +
        item.symbol;


    /* H2 */

    if (
        item.id === "H2"
    ){

        molecule(

            [
                {
                    element:"H",
                    x:-.55,
                    y:0,
                    z:0
                },

                {
                    element:"H",
                    x:.55,
                    y:0,
                    z:0
                }
            ],

            [
                [0,1]
            ]

        );

        return;

    }


    /* O2 */

    if (
        item.id === "O2"
    ){

        molecule(

            [
                {
                    element:"O",
                    x:-.75,
                    y:0,
                    z:0
                },

                {
                    element:"O",
                    x:.75,
                    y:0,
                    z:0
                }
            ],

            [
                [0,1]
            ]

        );

        return;

    }


    /* WATER */

    if (
        item.id === "water"
    ){

        molecule(

            [
                {
                    element:"O",
                    x:0,
                    y:.25,
                    z:0
                },

                {
                    element:"H",
                    x:-.8,
                    y:-.35,
                    z:0
                },

                {
                    element:"H",
                    x:.8,
                    y:-.35,
                    z:0
                }
            ],

            [
                [0,1],
                [0,2]
            ]

        );

        return;

    }


    /* CO2 */

    if (
        item.id === "CO2"
    ){

        molecule(

            [
                {
                    element:"O",
                    x:-1.15,
                    y:0,
                    z:0
                },

                {
                    element:"C",
                    x:0,
                    y:0,
                    z:0
                },

                {
                    element:"O",
                    x:1.15,
                    y:0,
                    z:0
                }
            ],

            [
                [0,1],
                [1,2]
            ]

        );

        return;

    }


    /* GENERIC ATOM */

    molecule(

        [
            {
                element:
                    item.element ||
                    "C",

                x:0,

                y:0,

                z:0
            }
        ],

        []

    );

}


/* =========================================================
   RUN REACTION
========================================================= */

function runReaction(){

    if (
        selected.length < 2
    ){

        formula.textContent =
            "Select at least 2 substances.";

        resultName.textContent =
            "Choose reactants from the substance panel.";

        return;

    }


    const sorted =
        [...selected]
            .sort();


    const reaction =
        reactions.find(
            item => {

                const expected =
                    [...item.reactants]
                        .sort();


                return (
                    JSON.stringify(
                        sorted
                    ) ===
                    JSON.stringify(
                        expected
                    )
                );

            }
        );


    /*
       Heat animation.
    */

    setHeatEffect(
        conditions.includes(
            "heat"
        )
    );


    if (!reaction){

        formula.textContent =
            "Simulation not available";


        resultName.textContent =
            "This combination is not currently included in the educational reaction database.";

        return;

    }


    formula.textContent =
        reaction.formula;


    resultName.textContent =
        reaction.name;


    if (
        reaction.product
    ){

        const product =
            substances.find(
                item =>
                    item.id ===
                    reaction.product
            );


        if (product){

            showMolecule(
                product
            );

        }

    }

}


/* =========================================================
   RESET
========================================================= */

function reset(){

    selected = [];

    conditions = [];


    document
        .querySelectorAll(
            ".condition"
        )
        .forEach(
            button => {

                button.classList
                    .remove(
                        "active"
                    );

            }
        );


    renderReactants();


    formula.textContent =
        "—";


    resultName.textContent =
        "Select reactants and run the simulation.";


    viewerTitle.textContent =
        "Select a substance";


    setHeatEffect(
        false
    );


    clearMolecule();

}


/* =========================================================

========================================================= */

document
    .getElementById("run")
    .addEventListener(
        "click",
        runReaction
    );


document
    .getElementById("reset")
    .addEventListener(
        "click",
        reset
    );
