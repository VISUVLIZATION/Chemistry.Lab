<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChemLab 3D</title>
<style>
:root{--bg:#f3f5fa;--card:#fff;--tx:#141a2e;--mu:#667090;--ac:#2f6bff;--bd:#d9dfee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1020;--card:#161c33;--tx:#eef1fb;--mu:#8f99ba;--bd:#283052}}
:root[data-theme="dark"]{--bg:#0c1020;--card:#161c33;--tx:#eef1fb;--mu:#8f99ba;--bd:#283052}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:12px;max-width:640px}
h1{font-size:20px;margin:4px 0 10px}
#stage{height:300px;border-radius:16px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#26326e,#090c1b)}
canvas{width:100%;height:100%;display:block}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;margin:10px 0}
#eq{font-size:20px;font-weight:600;text-align:center;min-height:30px}
#hint{color:var(--mu);font-size:13px;text-align:center;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.g4{grid-template-columns:repeat(4,1fr)}
button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:9px 4px;cursor:pointer}
button small{display:block;color:var(--mu);font-size:10px}
button.on{border-color:var(--ac);background:var(--ac);color:#fff}button.on small{color:#dfe8ff}
button:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;margin:8px 0}.row button{flex:1}
.go{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:700}
h3{font-size:14px;margin:14px 0 4px;color:var(--mu);font-weight:600}
#q{width:100%;padding:10px 12px;margin-top:10px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}#chips{max-height:232px;overflow-y:auto}#conc{margin:0}
#res .e{font-size:19px;font-weight:700;margin:6px 0}
</style></head><body>
<h1>⚗️ ChemLab 3D</h1>
<div id="err" style="display:none;background:#b3261e;color:#fff;padding:10px;border-radius:10px;margin-bottom:8px;font-size:13px"></div>
<div id="stage"><canvas></canvas></div>
<div class="card"><div id="eq">Pick a substance</div><div id="hint"></div></div>
<input id="q" type="search" placeholder="🔍 Search substances (acid, Cu, salt, gas…)">
<div class="row" id="conc" style="display:none"><button data-k="d">💧 Dilute</button><button data-k="c">🧪 Concentrated</button></div>
<div class="grid" id="chips"></div>
<div class="row"><button id="plus">＋ Add sign</button><button id="end">✓ End reactants</button></div>
<h3>Catalyst</h3><div class="grid g4" id="cats"></div>
<h3>Heat</h3><div class="row"><button id="heat">🔥 Heat: OFF</button></div>
<div class="row"><button class="go" id="go">▶ React</button><button id="reset">↺ Reset</button></div>
<div class="card" id="res" style="display:none"></div>

  g.position.y=0;
  if(anim){const pc=Math.min(1,(t-anim.t0)/1.8),q=anim.ok?pc*pc:0;g.position.x=u.x0*(1-q);g.position.y=Math.sin(t*40+u.x0)*.12*(.4+pc)*(heat?1.5:1);if(anim.ok)k*=1-.85*q}
  g.scale.setScalar(Math.max(k,.01))});
 crystal.rotation.y+=dt;crystal.rotation.x+=dt*.5;crystal.position.y=2.8+Math.sin(t*2)*.1;
 flame.children.forEach((c,i)=>{if(i)c.scale.y=1+.2*Math.sin(t*17+i*2)});
 if(anim){const p=(t-anim.t0)/1.8;
  if(anim.ok&&p>.85){const f=Math.min(1,(p-.85)/.6);burst.visible=true;burst.scale.setScalar(.5+f*5);burst.material.opacity=.8*(1-f);pl.intensity=3*(1-f)}
  if(p>=1.45||(!anim.ok&&p>=1)){const a=anim;anim=null;burst.visible=false;pl.intensity=0;finish(a)}}
 if(fxs&&clock>=fxs.t0){const f=fxs,e=clock-f.t0,W=Math.max(1.5,lastW*.3),n=k=>Math.round(k*dt+rnd()*.99);
  if(f.core){if(e<5){const I=e<4?1:5-e;pl.color.setHex(f.f);pl.intensity=(1.4+rnd()*.8)*I;
   for(let i=n(260*I);i--;)sp(fire,{l:.6+rnd()*.7,x:(rnd()-.5)*W,y:-1.3+rnd()*.3,z:(rnd()-.5)*.8,vx:0,vy:1.3+rnd()*1.5,vz:0});
   if(f.sp)for(let i=n(50);i--;)sp(fire,{w:1,l:.3+rnd()*.4,x:(rnd()-.5)*W,y:-.5,z:0,vx:(rnd()-.5)*8,vy:rnd()*5,vz:(rnd()-.5)*3})}else pl.intensity=0}
  if(f.sm!=null&&e<6)for(let i=n(45);i--;)sp(smoke,{v:f.sm,l:2+rnd()*1.5,x:(rnd()-.5)*W,y:.3,z:rnd()-.5,vx:(rnd()-.5)*.3,vy:.6+rnd()*.5,vz:0});
  if(f.b!=null&&e<5)for(let i=n(70);i--;)sp(bub,{k:'b',col:[.85,.95,1],l:1.5+rnd(),x:(rnd()-.5)*W*1.6,y:-1.5,z:rnd(),vx:0,vy:.8+rnd()*.8,vz:0});
  if(f.p!=null&&e<3)for(let i=n(90);i--;)sp(bub,{k:'p',col:hx(f.p),l:9,x:(rnd()-.5)*lastW*.7,y:2,z:rnd(),vx:0,vy:-1.4,vz:0})}
 upd(fire,dt,noop,(q,t)=>{if(q.w)return[t,t,t*.8];const k=fxs&&fxs.core||[1,.5,.1],o=[1,.45,.08],u=t>.65?mix(o,k,(t-.65)/.35):mix([.2,.02,0],o,t/.65),a=Math.min(1,t*5)*.9;return u.map(v=>v*a)});
 upd(smoke,dt,q=>{q.vx+=Math.sin(clock*2+q.y*2)*.01},(q,t)=>{const v=q.v*Math.min(1,t*2)*.8+.03;return[v,v,v]});
 upd(bub,dt,q=>{if(q.k==='p'){if(q.y<-1.7){q.y=-1.7+(q.z%1)*.12;q.vy=0}}else q.vx=Math.sin(clock*6+q.z*9)*.3},(q,t)=>q.col.map(v=>v*Math.min(1,t*4)));
 ren.render(sc,cam)}

const toks=(l,gh)=>{const t=[];l.forEach((id,i)=>{if(i)t.push('+');t.push(id)});if(gh)t.push('+','?');return t};


function refresh(rebuild){
 const items=R.concat(pending?[full(pending)]:[]),gh=!pending&&dangling&&!ended;
 $('#eq').innerHTML=items.length?items.map(fm).join(' + ')+(gh?' + ?':'')+(ended?' → ?':''):'Pick a substance';
 $('#hint').textContent=ended?'Step 3: choose a catalyst and heat, then tap React.':pending?(R.length<3?'Tap ＋ to add another substance, or End reactants.':'Tap End reactants (4 is the maximum).'):dangling?'Now pick the next substance.':'Step 1: tap a substance.';
 document.querySelectorAll('#chips button').forEach(b=>{b.classList.toggle('on',b.dataset.id===pending);b.disabled=ended||busy||R.length>=4});
 $('#plus').disabled=ended||busy||!pending||R.length>=3;
 $('#end').disabled=ended||busy||!items.length;
 $('#go').disabled=!ended||busy;
 $('#conc').style.display=pending&&isQ(pending)&&!ended?'flex':'none';document.querySelectorAll('#conc button').forEach(b=>b.classList.toggle('on',b.dataset.k===cc));
 document.querySelectorAll('#cats button').forEach(b=>b.classList.toggle('on',(b.dataset.c||null)===cat));
 $('#heat').classList.toggle('on',heat);$('#heat').textContent='🔥 Heat: '+(heat?'ON':'OFF');
 crystal.visible=!!cat;if(cat)crystal.material.color.setHex(CT[cat][1]);flame.visible=heat;
 if(rebuild)show(toks(items,gh))}

function chips(){const q=$('#q').value.toLowerCase().trim(),l=SUB.filter(id=>!q||(id+M[id][0]+M[id][1]+M[id][3]).toLowerCase().includes(q));$('#chips').innerHTML=l.map(id=>`<button data-id="${id}"><b>${fm(id)}</b><small>${M[id][0]}</small></button>`).join('')||'<div style="grid-column:1/-1;color:var(--mu);text-align:center">No substance found</div>';refresh(false)}
$('#q').oninput=chips;chips();
$('#conc').onclick=e=>{const b=e.target.closest('button');if(!b)return;cc=b.dataset.k;refresh(true)};
$('#cats').innerHTML=['<button data-c="">None<small>no catalyst</small></button>'].concat(Object.keys(CT).map(k=>`<button data-c="${k}">${CT[k][0]}<small>catalyst</small></button>`)).join('');
$('#chips').onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;pending=b.dataset.id;refresh(true)};
$('#cats').onclick=e=>{const b=e.target.closest('button');if(!b)return;cat=b.dataset.c||null;refresh(false)};
$('#heat').onclick=()=>{heat=!heat;refresh(false)};
$('#plus').onclick=()=>{if(!pending)return;R.push(full(pending));pending=null;dangling=true;refresh(true)};
$('#end').onclick=()=>{if(pending){R.push(full(pending));pending=null}dangling=false;ended=true;refresh(true)};
$('#reset').onclick=()=>{R=[];pending=null;dangling=false;ended=false;cat=null;heat=false;busy=false;anim=null;burst.visible=false;fxs=null;cc='d';pl.intensity=0;[fire,smoke,bub].forEach(p=>p.d.forEach(q=>q.l=0));$('#res').style.display='none';refresh(true)};
$('#go').onclick=()=>{
 if(!ended||busy)return;
 const bs=R.map(x=>x.split(':')[0]),cn={};R.forEach(x=>{const[b,c]=x.split(':');if(c)cn[b]=c});
 const key=[...new Set(bs)].sort().join(),rx=RX.find(r=>Object.keys(r[0]).sort().join()===key);
 let ok=false,msg='';
 if(!rx)msg='🚫 <b>No reaction.</b> These substances do not react with each other here. Reset and try another mix.';
 else{const c=rx[2],miss=[];if(c.h&&!heat)miss.push('🔥 heat');if(c.c&&cat!==c.c)miss.push('catalyst '+CT[c.c][0]);for(const[b,v]of Object.entries(c.k||{}))if(cn[b]&&cn[b]!==v)miss.push((v==='c'?'concentrated ':'dilute ')+fm(b));
  if(miss.length)msg='⚠️ <b>Nothing happens yet.</b> This mix can react, but it needs '+miss.join(' and ')+'.';else ok=true}
 busy=true;$('#res').style.display='block';$('#res').innerHTML='⚗️ Reacting…';
 show(toks(R));anim={t0:clock,ok,rx,msg};fxs=ok?Object.assign({},rx[4]||{},{t0:clock+1.2}):null;if(fxs&&fxs.f!=null)fxs.core=hx(fxs.f);refresh(false)};
function finish(a){
 busy=false;
 if(a.ok){const pr=[];Object.entries(a.rx[1]).forEach(([k,n])=>{for(let i=0;i<n;i++)pr.push(k)});
  show(toks(pr));
  const cd=(a.rx[2].h?'🔥':'')+(a.rx[2].c?CT[a.rx[2].c][0]:'');
  $('#res').innerHTML='✅ <b>Reaction complete!</b><div class="e">'+co(a.rx[0]).join(' + ')+' →'+(cd?'<sup>'+cd+'</sup>':'')+' '+co(a.rx[1]).join(' + ')+'</div>Products: '+Object.keys(a.rx[1]).map(k=>M[k][0]).join(', ')+'. '+a.rx[3]}
 else{show(toks(R));$('#res').innerHTML=a.msg}
 refresh(false)}
resize();refresh(true);requestAnimationFrame(loop);
</script></body></html>
