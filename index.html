<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChemLab 3D</title>
<style>
:root{--bg:#f3f5fa;--card:#fff;--tx:#141a2e;--mu:#667090;--ac:#2f6bff;--bd:#d9dfee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1020;--card:#161c33;--tx:#eef1fb;--mu:#8f99ba;--bd:#283052}}
:root[data-theme="dark"]{--bg:#0c1020;--card:#161c33;--tx:#eef1fb;--mu:#8f99ba;--bd:#283052}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:12px;max-width:640px}
h1{font-size:20px;margin:4px 0 10px}
#stage{height:300px;border-radius:16px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#26326e,#090c1b)}
canvas{width:100%;height:100%;display:block}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;margin:10px 0}
#eq{font-size:20px;font-weight:600;text-align:center;min-height:30px}
#hint{color:var(--mu);font-size:13px;text-align:center;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.g4{grid-template-columns:repeat(4,1fr)}
button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:9px 4px;cursor:pointer}
button small{display:block;color:var(--mu);font-size:10px}
button.on{border-color:var(--ac);background:var(--ac);color:#fff}button.on small{color:#dfe8ff}
button:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;margin:8px 0}.row button{flex:1}
.go{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:700}
h3{font-size:14px;margin:14px 0 4px;color:var(--mu);font-weight:600}
#q{width:100%;padding:10px 12px;margin-top:10px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}#chips{max-height:232px;overflow-y:auto}#conc{margin:0}
#res .e{font-size:19px;font-weight:700;margin:6px 0}
</style></head><body>
<h1>⚗️ ChemLab 3D</h1>
<div id="err" style="display:none;background:#b3261e;color:#fff;padding:10px;border-radius:10px;margin-bottom:8px;font-size:13px"></div>
<div id="stage"><canvas></canvas></div>
<div class="card"><div id="eq">Pick a substance</div><div id="hint"></div></div>
<input id="q" type="search" placeholder="🔍 Search substances (acid, Cu, salt, gas…)">
<div class="row" id="conc" style="display:none"><button data-k="d">💧 Dilute</button><button data-k="c">🧪 Concentrated</button></div>
<div class="grid" id="chips"></div>
<div class="row"><button id="plus">＋ Add sign</button><button id="end">✓ End reactants</button></div>
<h3>Catalyst</h3><div class="grid g4" id="cats"></div>
<h3>Heat</h3><div class="row"><button id="heat">🔥 Heat: OFF</button></div>
<div class="row"><button class="go" id="go">▶ React</button><button id="reset">↺ Reset</button></div>
<div class="card" id="res" style="display:none"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
